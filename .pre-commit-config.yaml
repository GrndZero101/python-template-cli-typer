# The gate for the CLI TEMPLATE REPOSITORY itself. Run with: prek run --all-files
#
# This repo has no `tools/` of its own: the hooks, the conventions checker and the rest of the
# machinery belong to the base template (python-template-base), which a generated project receives.
# Borrowing them here would mean copying them or pinning a fetch, and either drifts. So the gate
# is the hooks that need no scripts, and the generation tests carry the rest.
#
# - Every file check EXCLUDES `template/`. It holds Jinja and no `pyproject.toml`, so ruff would
#   fall back to default rules and ty would have no environment to resolve imports through.
# - What checks it instead is `generation-tests` below: it generates projects (this layer with the
#   base layered on) and runs THAT project's gate and test suite inside each, so the lint list
#   exists once, in the file a generated project actually receives.
# - The rest covers the repo's own markdown, its one test module, and the commit-level rules that
#   need a `.git` to act on.
#
# NOTE: `repo: builtin` is a prek extension and is NOT understood by plain `pre-commit`.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: ^template/
      - id: end-of-file-fixer
        exclude: ^template/
      # --assume-in-merge: see the base's template/.pre-commit-config.yaml.jinja.
      - id: check-merge-conflict
        args: [--assume-in-merge]
        exclude: ^template/
      - id: check-added-large-files
      - id: check-yaml
        exclude: ^template/
      - id: check-toml
      - id: check-json
        exclude: ^template/
      - id: detect-private-key
      # Work happens on a branch; main only ever receives merge commits. `stages: [pre-commit]` is
      # what lets `git merge --no-ff` through, as in the base's config.
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        exclude: ^template/
      - id: rumdl
        exclude: ^template/

  # The root's own Python is just the generation tests, but they are held to the same rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # The fixer before the formatter: a fix can leave code that needs reformatting.
      - id: ruff-check
        args: [--fix]
        exclude: ^template/
      - id: ruff-format
        exclude: ^template/

  - repo: local
    hooks:
      # The only thing that verifies template/. It generates projects and runs each one's gate and
      # test suite inside it, so it is slow — around a minute. That is the price of the template
      # not being lintable in place.
      #
      # `files:` scopes it to what can change a generated project: the template, the copier
      # config, the tests themselves, and the dependencies that run them. A commit touching only
      # this repo's own docs skips it. `.github/workflows/ci.yml` filters pushes on the same paths;
      # change both together. To skip it at commit anyway:
      #   SKIP=generation-tests git commit ...
      # `stages: [pre-commit]` is load-bearing. Without it the hook also fires at the commit-msg
      # stage, running the whole suite a second time for a message check.
      - id: generation-tests
        name: generate projects and run their gates
        entry: uv run pytest tests
        language: system
        pass_filenames: false
        files: ^(template/|tests/|copier\.yml$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]
